[project]
name = "mantel-api"
version = "0.1.0"
description = "Mantel API: serves family content and config to the kiosk."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "watchfiles>=0.21",
  "httpx>=0.27",
  "icalendar>=6.0",
  "recurring-ical-events>=3.3",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  "pillow>=10.4",
  "pillow-heif>=0.18",
  # The Swiss Ephemeris, used with its built-in Moshier model so there are no
  # data files. AGPL-3.0; see the README's licence note.
  "pyswisseph>=2.10",
  "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
]
# `make smoke` only. Kept out of dev so `make install` stays quick and the
# Chromium download only happens on a machine that asks for it.
smoke = [
  "playwright>=1.47",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mantel_api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["mantel_api", "tests"]

[[tool.mypy.overrides]]
# Neither of these ships a py.typed marker.
module = ["recurring_ical_events.*", "swisseph.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
